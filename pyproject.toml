[project]
name = "nanoevals"
version = "0.2.0"
description = "Minimal, robust evaluation framework for LLMs and ReACT-based agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "groq",
]

[project.entry-points."pytest11"]
nanoevals = "nanoevals.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require a live LLM API key (deselect with -m 'not integration')",
]
